# API Gateway: punto único de entrada. Enruta según método HTTP + ruta.

# Resolver de Docker: permite que Nginx arranque aunque un servicio esté caído
# y que solo las rutas de ese servicio respondan error (aislamiento de fallos).
resolver 127.0.0.11 valid=10s ipv6=off;

# Qué servicio atiende /files según el método
map $request_method $files_service {
    GET     list;
    POST    upload;
    default "";
}

# Qué servicio atiende /files/{id} según el método
map $request_method $file_id_service {
    GET     download;
    DELETE  delete;
    default "";
}

server {
    listen 80;
    client_max_body_size 25m;
    default_type application/json;

    location = /files {
        if ($files_service = "") { return 405 '{"error":"Método no permitido"}'; }
        proxy_pass http://$files_service:5000;
    }

    location ~ ^/files/[^/]+$ {
        if ($file_id_service = "") { return 405 '{"error":"Método no permitido"}'; }
        proxy_pass http://$file_id_service:5000;
    }

    location = /health {
        return 200 '{"service":"gateway","status":"ok"}';
    }

    # Salud de cada microservicio: /health/upload, /health/list, etc.
    # (lo usa el frontend para mostrar qué servicios están arriba)
    location ~ ^/health/(upload|download|list|delete|metadata)$ {
        proxy_pass http://$1:5000/health;
    }

    # Frontend (cliente web)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        default_type text/html;
        try_files $uri $uri/ =404;
    }

    # Si un servicio está caído, se responde JSON en vez de la página de Nginx
    error_page 502 504 = @down;
    location @down {
        default_type application/json;
        return 503 '{"error":"Servicio no disponible"}';
    }
}
